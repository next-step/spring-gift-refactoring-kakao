spring:
  jpa:
    open-in-view: false
    hibernate.ddl-auto: create-drop

    properties.hibernate:
      format_sql: true
      highlight_sql: true
      use_sql_comments: true
      globally_quoted_identifiers: false

  flyway.enabled: false

jwt:
  secret: 'this is a jwt secret for test'
  expiration: 360

kakao.login:
  client-id: 'this is a kakao client id for test'
  client-secret: 'this is a kakao client secret for test'
  redirect-uri: 'this is a kakao redirect uri for test'
