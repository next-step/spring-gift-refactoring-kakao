spring.application.name=spring-gift
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
jwt.secret=test-secret-key-at-least-256-bits-long-for-testing
jwt.expiration=3600000
kakao.login.client-id=test
kakao.login.client-secret=test
kakao.login.redirect-uri=http://localhost:8080/api/auth/kakao/callback
