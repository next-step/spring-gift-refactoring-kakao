spring.application.name=spring-gift
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
jwt.secret=a-string-secret-at-least-256-bits-long-for-test-environment
jwt.expiration=3600000
kakao.login.client-id=test-client-id
kakao.login.client-secret=test-client-secret
kakao.login.redirect-uri=http://localhost:8080/api/auth/kakao/callback
kakao.login.authorize-url=https://kauth.kakao.com/oauth/authorize
kakao.login.token-url=https://kauth.kakao.com/oauth/token
kakao.login.user-info-url=https://kapi.kakao.com/v2/user/me
kakao.login.scope=account_email,talk_message
kakao.api.message-send-url=https://kapi.kakao.com/v2/api/talk/memo/default/send
