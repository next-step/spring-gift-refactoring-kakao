spring.application.name=spring-gift
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.main.web-application-type=none
spring.flyway.enabled=false

# Docker Compose MySQL (테스트 JVM에서 데이터 셋업/클린업용)
spring.datasource.url=jdbc:mysql://localhost:13306/gift
spring.datasource.username=gift
spring.datasource.password=gift
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT (앱 컨테이너와 동일한 시크릿으로 토큰 생성)
jwt.secret=a-string-secret-at-least-256-bits-long
jwt.expiration=3600000

# Kakao API (테스트용 — 프로퍼티 바인딩에 필요)
kakao.login.client-id=test-client-id
kakao.login.client-secret=
kakao.login.redirect-uri=http://localhost:8080/api/auth/kakao/callback
