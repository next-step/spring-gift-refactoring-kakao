spring:
  jpa:
    hibernate:
      ddl-auto: create-drop

    properties:
      format_sql: true
      highlight_sql: true
      use_sql_comments: true
      globally_quoted_identifiers: true

  datasource:
    url: jdbc:h2:mem:test-db;DB_CLOSE_DELAY=-1

  flyway:
    enabled: false

logging:
  level:
    sql: debug
