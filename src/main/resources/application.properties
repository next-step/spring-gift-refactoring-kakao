spring.application.name=spring-gift
jwt.secret=${JWT_SECRET:a-string-secret-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:3600000}
kakao.login.client-id=${KAKAO_CLIENT_ID:}
kakao.login.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.login.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
kakao.login.authorize-url=https://kauth.kakao.com/oauth/authorize
kakao.login.token-url=https://kauth.kakao.com/oauth/token
kakao.login.user-info-url=https://kapi.kakao.com/v2/user/me
kakao.login.scope=account_email,talk_message
kakao.api.message-send-url=https://kapi.kakao.com/v2/api/talk/memo/default/send
